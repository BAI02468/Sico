<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>SICO</title>
    <script>
      // Apply the initial locale to <html lang> before React mounts so CSS like
      // `:lang(zh)` (CJK font stack) is correct on the very first frame (FOUC).
      // Priority mirrors `localeAtom.loadLocaleFromLS`: stored preference >
      // detected browser language > default "en". `localeAtom` persists a RAW
      // locale tag (e.g. "en" / "zh-CN"), so this must NOT JSON.parse — it reads
      // and validates the bare string.
      try {
        const stored = localStorage.getItem("sico.locale");
        let lang = stored === "zh-CN" || stored === "en" ? stored : null;
        if (!lang) {
          const tags = navigator.languages && navigator.languages.length
            ? navigator.languages
            : [navigator.language];
          for (const tag of tags) {
            const lower = (tag || "").toLowerCase();
            if (lower.indexOf("zh") === 0) { lang = "zh-CN"; break; }
            if (lower.indexOf("en") === 0) { lang = "en"; break; }
          }
        }
        document.documentElement.lang = lang || "en";
      } catch {
        document.documentElement.lang = "en";
      }
    </script>
  </head>
  <body>
    <div id="root">
      <div class="shell-boot" aria-hidden="true">
        <div class="shell-boot__logo">SICO</div>
        <div class="shell-boot__label">Loading…</div>
      </div>
      <style>
        /*
          Inline style — renders before the JS bundle mounts Tailwind's
          @theme variables, so we use raw values instead of CSS custom
          properties. `#555` matches `--color-foreground-tertiary` closely enough
          for a one-shot loading label.
        */
        .shell-boot { display: flex; flex-direction: column; align-items: center; justify-content: center;
          min-height: 100vh; opacity: 0; animation: shellBootFadeIn 200ms ease-out forwards; }
        .shell-boot__logo { font-family: Roboto, system-ui, sans-serif; font-size: 2rem; font-weight: 500; }
        .shell-boot__label { margin-top: 0.5rem; color: #555; font-family: Roboto, system-ui, sans-serif; }
        @keyframes shellBootFadeIn { to { opacity: 1; } }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
