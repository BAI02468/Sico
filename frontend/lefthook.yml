commit-msg:
  commands:
    commitlint:
      run: npx commitlint --edit {1}

pre-commit:
  commands:
    lint:
      run: pnpm turbo run lint --filter=...[HEAD]
    i18n:
      glob: "{packages/app/src,packages/shared/src}/**/*.{ts,tsx}"
      run: pnpm i18n:extract && pnpm i18n:compile && git add packages/shared/src/locales

pre-push:
  commands:
    test:
      run: pnpm turbo run test --filter=...[HEAD]
